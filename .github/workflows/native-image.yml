name: Native Image Build

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            artifact: fastqc-linux-amd64
          - os: ubuntu-24.04-arm
            arch: arm64
            artifact: fastqc-linux-arm64
          - os: macos-latest
            arch: arm64
            artifact: fastqc-macos-arm64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.artifact }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Set up Ant
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update -q && sudo apt-get install -yq ant
          else
            brew install ant
          fi

      - name: Build native image
        run: |
          export GRAALVM_HOME=$JAVA_HOME
          ant native-image

      - name: Smoke test
        run: |
          ./fastqc --version || true
          # Run on a minimal synthetic FASTQ
          printf '@read1\nACGT\n+\nIIII\n' > /tmp/test.fastq
          ./fastqc /tmp/test.fastq
          ls -la /tmp/test_fastqc.zip

      - name: Rename artifact
        run: mv fastqc ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.artifact }}"
