name: Native Image Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for release trigger
        id: check
        run: |
          msg=$(git log -1 --pretty=%B)
          if echo "$msg" | grep -q '\[release\]'; then
            echo "release=true" >> $GITHUB_OUTPUT
          else
            echo "release=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract version
        id: version
        run: |
          ver=$(grep 'VERSION\s*=' uk/ac/babraham/FastQC/FastQCApplication.java \
                | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$ver" >> $GITHUB_OUTPUT

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: fastqc-linux-amd64
          - os: ubuntu-24.04-arm
            artifact: fastqc-linux-arm64
          - os: macos-latest
            artifact: fastqc-macos-arm64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.artifact }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Set up Ant and build tools
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update -q && sudo apt-get install -yq ant cmake
          else
            brew install ant cmake
          fi

      - name: Build zlib-ng (compat mode)
        run: |
          git clone --depth 1 https://github.com/zlib-ng/zlib-ng.git /tmp/zlib-ng
          cmake -B /tmp/zlib-ng/build -S /tmp/zlib-ng \
            -DZLIB_COMPAT=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/zlib-ng-compat
          cmake --build /tmp/zlib-ng/build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          cmake --install /tmp/zlib-ng/build

      - name: Build native image with zlib-ng
        run: |
          export GRAALVM_HOME=$JAVA_HOME
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ZLIB_LINK="-H:NativeLinkerOption=-force_load -H:NativeLinkerOption=/tmp/zlib-ng-compat/lib/libz.a"
          else
            ZLIB_LINK="-H:NativeLinkerOption=-Wl,--whole-archive -H:NativeLinkerOption=/tmp/zlib-ng-compat/lib/libz.a -H:NativeLinkerOption=-Wl,--no-whole-archive"
          fi
          ant native-image -Dnative-image.extra-args="$ZLIB_LINK"

      - name: Smoke test
        run: |
          ./fastqc --version || true
          printf '@read1\nACGT\n+\nIIII\n' > /tmp/test.fastq
          ./fastqc /tmp/test.fastq
          ls -la /tmp/test_fastqc.zip

      - name: Rename artifact
        run: mv fastqc ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.check.outputs.version }}"
          tag="v${version}"
          gh release create "$tag" \
            --title "FastQC $version" \
            --generate-notes \
            artifacts/fastqc-linux-amd64/fastqc-linux-amd64 \
            artifacts/fastqc-linux-arm64/fastqc-linux-arm64 \
            artifacts/fastqc-macos-arm64/fastqc-macos-arm64
